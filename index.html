<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore path from 404.html redirect
      (function() {
        var qs = window.location.search;
        if (qs) {
          var params = new URLSearchParams(qs);
          var p = params.get('p');
          var h = params.get('h') || '';
          if (p) {
            window.history.replaceState(null, null, p + h);
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/src/assets/backgroundImg.webp" type="image/webp" fetchpriority="high" />
    <title>care2elevate</title>
  </head>
  <body>
    <div id="root">
      <style>
        #app-skeleton { display: flex; flex-direction: column; min-height: 100vh; }
        #sk-nav { background: #D66252; height: 60px; width: 100%; flex-shrink: 0; }
        #sk-hero { background: #2b2420; flex: 1; min-height: clamp(600px, 80vh, 760px); }
      </style>
      <div id="app-skeleton">
        <div id="sk-nav"></div>
        <div id="sk-hero"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
